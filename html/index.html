<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<title>Easytime</title>
		<link rel="stylesheet" href="css/bootstrap.min.css" />
		<link rel="stylesheet" href="css/stylesheet.css" />
		<link rel="stylesheet" href="css/weather-icons.min.css" />
	</head>

	<body>
		<div id="easytime" data-bs-theme="dark">
			<div id="easytime-card" class="card shadow">
				<div id="easytime-card-body" class="card-header border-bottom-0 position-relative">
					<div id="easytime-clouds"></div>
					<div id="easytime-stars"></div>
					<div id="easytime-card-sun">
						<img id="easytime-sun" src="images/sun.svg" class="img-fluid" />
					</div>
					<div id="easytime-card-moon">
						<img id="easytime-moon" src="images/moon.svg" class="img-fluid" />
					</div>
				</div>
				<div id="easytime-menu" class="card-body bg-dark">
					<div
						class="d-flex w-100 gap-1 justify-content-center align-items-center">
						<h1 id="easytime-menu-time">08:00</h1>
					</div>
					<div class="row">
						<div class="col-12 position-relative">
							<div
								id="easytime-info-text"
								class="text-muted text-center w-100"
								style="font-size: 0.75rem; margin-top: -10px; margin-bottom: 5px;">
							</div>
							<input
								type="range"
								class="form-range my-4"
								min="8"
								max="31"
								step="0.01"
								value="8"
								id="easytime-range" />
						</div>
					</div>
					<div class="row mb-2 text-light justify-content-between text-center">
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="clear"
							title="Czyste Niebo"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-clear">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-clear"
									value="CLEAR" />
								<span class="form-check-label">
									<i class="wi wi-day-sunny text-light"></i>
								</span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="extrasunny"
							title="Słonecznie"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-extrasunny">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-extrasunny"
									value="EXTRASUNNY" />
								<span class="form-check-label">
									<i class="wi wi-hot"></i>
								</span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="clouds"
							title="Pochmurnie"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-clouds">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-clouds"
									value="CLOUDS" />
								<span class="form-check-label"
									><i class="wi wi-cloudy"></i
								></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="overcast"
							title="Zaciemnienie"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-overcast">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-overcast"
									value="OVERCAST" />
								<span class="form-check-label">
									<i class="wi wi-day-cloudy"></i>
								</span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="rain"
							title="Deszcz"
							data-bs-trigger="hover">
							<label class="form-check" for="easytime-weather-rain">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-rain"
									value="RAIN" />
								<span class="form-check-label"
									><i class="wi wi-showers"></i
								></span>
							</label>
						</div>
					</div>
					<div class="row mb-2 text-light justify-content-between text-center">
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="clearing"
							title="Przejaśnienia"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-clearing">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-clearing"
									value="CLEARING" />
								<span class="form-check-label"
									><i class="wi wi-day-sunny-overcast"></i
								></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="thunder"
							title="Burza"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-thunder">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-thunder"
									value="THUNDER" />
								<span class="form-check-label"
									><i class="wi wi-thunderstorm"></i
								></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="smog"
							title="Smog"
							data-bs-trigger="hover">
							<label class="form-check" for="easytime-weather-smog">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-smog"
									value="SMOG" />
								<span class="form-check-label"><i class="wi wi-smog"></i></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="foggy"
							title="Mgła"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-foggy">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-foggy"
									value="FOGGY" />
								<span class="form-check-label"><i class="wi wi-fog"></i></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="snow"
							title="Śnieg"
							data-bs-trigger="hover">
							<label class="form-check" for="easytime-weather-snow">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-snow"
									value="SNOW" />
								<span class="form-check-label"
									><i class="wi wi-snowflake-cold"></i
								></span>
							</label>
						</div>
					</div>
					<div class="row mb-2 text-light justify-content-between text-center">
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="snowlight"
							title="Lekki Śnieg"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-snowlight">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-snowlight"
									value="SNOWLIGHT" />
								<span class="form-check-label"><i class="wi wi-snow"></i></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="blizzard"
							title="Śnieżyca"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-blizzard">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-blizzard"
									value="BLIZZARD" />
								<span class="form-check-label"
									><i class="wi wi-night-snow-thunderstorm"></i
								></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="halloween"
							title="Halloween"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-halloween">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-halloween"
									value="HALLOWEEN" />
								<span class="form-check-label"
									><i class="wi wi-alien"></i
								></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="xmas"
							title="Święta"
							data-bs-trigger="hover">
							<label class="form-check" for="easytime-weather-xmas">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-xmas"
									value="XMAS" />
								<span class="form-check-label"
									><i class="wi wi-sleet"></i
								></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="neutral"
							title="Neutralnie"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-neutral">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-neutral"
									value="NEUTRAL" />
								<span class="form-check-label"
									><i class="wi wi-moon-alt-new"></i
								></span>
							</label>
						</div>
					</div>
					<div
						id="new-weather"
						class="row mb-2 text-light justify-content-between text-center">
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="rain_halloween"
							title="Halloweenowy Deszcz"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-rain_halloween">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-rain_halloween"
									value="RAIN_HALLOWEEN" />
								<span class="form-check-label"
									><i class="wi wi-alien"></i><i class="wi wi-rain"></i
								></span>
							</label>
						</div>
						<div
							class="col-2"
							data-bs-toggle="tooltip"
							data-bs-placement="top"
							data-tooltip-id="snow_halloween"
							title="Halloweenowy Śnieg"
							data-bs-trigger="hover">
							<label
								class="form-check"
								for="easytime-weather-snow_halloween">
								<input
									type="radio"
									name="easytime-weather-selector"
									class="form-check-input easytime-weather-setting"
									id="easytime-weather-snow_halloween"
									value="SNOW_HALLOWEEN" />
								<span class="form-check-label"
									><i class="wi wi-alien"></i><i class="wi wi-snow"></i
								></span>
							</label>
						</div>
					</div>
					<div class="row mt-2">
						<div
							class="col-12 mt-2 d-flex flex-wrap justify-content-between align-items-stretch">
							<label
								class="form-check form-switch"
								for="easytime-freeze"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="freeze"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-freeze" />
								<span id="easytime-freeze-label" class="form-check-label"
									>Freeze time</span
								>
							</label>
							<label
								class="form-check form-switch"
								for="easytime-24hr"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="24hr"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-24hr"
									checked />
								<span id="easytime-24hr-label" class="form-check-label"
									>24 hr</span
								>
							</label>
							<label
								class="form-check form-switch"
								for="easytime-blackout"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="blackout"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-blackout" />
								<span id="easytime-blackout-label" class="form-check-label"
									>Blackout</span
								>
							</label>
							<label
								class="form-check form-switch"
								for="easytime-dynamic"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="dynamic"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-dynamic" />
								<span id="easytime-dynamic-label" class="form-check-label"
									>Dynamic weather</span
								>
							</label>
							<label
								class="form-check form-switch"
								for="easytime-instant-time"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="instanttime"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-instant-time" />
								<span id="easytime-instant-time-label" class="form-check-label"
									>Instant time change</span
								>
							</label>
							<label
								class="form-check form-switch"
								for="easytime-instant-weather"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="instantweather"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-instant-weather" />
								<span id="easytime-instant-weather-label" class="form-check-label"
									>Instant weather change</span
								>
							</label>
							<label
								class="form-check form-switch"
								for="easytime-tsunami"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="tsunami"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-tsunami" />
								<span id="easytime-tsunami-label" class="form-check-label"
									>Tsunami</span
								>
							</label>
						</div>
						<div
							class="col-12 mt-2 d-flex flex-wrap justify-content-between align-content-center">
							<label
								id="realtime"
								class="form-check form-switch"
								for="easytime-realtime"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="realtime"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-realtime" />
								<span id="easytime-realtime-label" class="form-check-label"
									>Use Realtime</span
								>
							</label>
							<label
								id="realweather"
								class="form-check form-switch"
								for="easytime-realweather"
								data-bs-toggle="tooltip"
								data-bs-placement="top"
								data-tooltip-id="realweather"
								title=""
								data-bs-trigger="hover">
								<input
									type="checkbox"
									class="form-check-input"
									id="easytime-realweather" />
								<span id="easytime-realweather-label" class="form-check-label"
									>Use Realweather</span
								>
							</label>
						</div>
					</div>
				</div>
				<div class="card-footer d-flex justify-content-between">
					<p
						id="real-location"
						class="fw-semibold p-0 m-0"
						style="font-size: 80%">
						<span id="real-city"></span><br />
						<small id="real-weather" class="text-muted fw-normal"></small>
					</p>
					<div class="d-flex gap-1 align-items-center" role="group">
						<button
							id="easytime-button-save"
							type="button"
							class="btn btn-sm btn-primary">
							Save Settings
						</button>
						<button
							id="easytime-button-change"
							type="button"
							class="btn btn-sm btn-success">
							Change
						</button>
						<button
							id="easytime-button-close"
							type="button"
							class="btn btn-sm btn-secondary">
							Close
						</button>
					</div>
				</div>
			</div>
		</div>
		<script src="js/bootstrap.bundle.min.js"></script>
		<script src="js/script.js"></script>
	</body>
</html>
